name: Setup linux-loongarch64 (LA64)
description: 在 x64 runner 上准备 linux-loongarch64 仿真运行环境：QEMU binfmt + loong64 sysroot（Debian sid 原生包）+ 龙芯 .NET SDK。产物：可运行 LA64 程序的 dotnet 与 QEMU_LD_PREFIX

runs:
  using: composite
  steps:
  - name: Install QEMU (loongarch64 binfmt)
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y qemu-user-static binfmt-support
      sudo update-binfmts --enable qemu-loongarch64 || true
      if [ ! -e /proc/sys/fs/binfmt_misc/qemu-loongarch64 ]; then
        # 镜像未注册 binfmt 时用官方 multiarch 镜像兜底注册
        docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      fi
      test -e /proc/sys/fs/binfmt_misc/qemu-loongarch64
      cat /proc/sys/fs/binfmt_misc/qemu-loongarch64

  # 宿主 x64 没有 loong64 原生 libc，需要一个 loong64 sysroot 供 QEMU 的 ELF 解释器（QEMU_LD_PREFIX）使用。
  # 直接取 Debian sid 的 loong64 原生包组装：glibc 2.43 满足龙芯 .NET 10 运行时要求
  # （Ubuntu 自带的 libc6-loong64-cross 2.39 太旧，libcoreclr 会因无法识别的重定位而加载失败）。
  - name: Build loong64 sysroot (Debian sid native packages)
    shell: bash
    run: |
      set -euo pipefail
      mirror=https://deb.debian.org/debian
      root="$HOME/la64root"
      mkdir -p "$root"

      # 1) 解析索引（含完整性校验与重试，避免截断的 Packages.gz 导致漏包）
      idx="$HOME/la64-packages.gz"
      for i in 1 2 3 4 5; do
        rm -f "$idx"
        if curl -fsSL --retry 5 --retry-all-errors -o "$idx" "$mirror/dists/sid/main/binary-loong64/Packages.gz" \
           && gzip -t "$idx"; then break; fi
        echo "index retry $i"; sleep 3
      done
      gzip -t "$idx"

      # 2) 运行时所需包：libc6 / libstdc++ / libgcc / OpenSSL 及其依赖（zlib、zstd）
      zcat "$idx" | awk 'BEGIN{RS="";FS="\n"} {
        pkg="";
        for (i=1;i<=NF;i++) { if ($i ~ /^Package: /) pkg=substr($i,10) }
        if (pkg=="libc6"||pkg=="libgcc-s1"||pkg=="libstdc++6"||pkg=="libssl3t64"||pkg=="zlib1g"||pkg=="libzstd1"||pkg=="libicu76"||pkg=="libcrypt1"||pkg=="liblzma5") {
          for (i=1;i<=NF;i++) { if ($i ~ /^Filename: /) print substr($i,11) }
        }
      }' | sort -u > "$HOME/la64-pkgs.txt"
      cat "$HOME/la64-pkgs.txt"

      # 3) 下载并解包进同一个前缀，保留 Debian 的 merged-usr 软链布局
      while read -r f; do
        n=$(basename "$f")
        curl -fsSL --retry 3 -o "$HOME/$n" "$mirror/$f"
        dpkg -x "$HOME/$n" "$root"
      done < "$HOME/la64-pkgs.txt"

      # 4) 顶层 /lib、/lib64 在 Debian 里由 base-files 提供（merged-usr），这里手工补上，
      #    否则 ELF 解释器路径 /lib64/ld-linux-loongarch-lp64d.so.1 无法解析
      ln -sfn usr/lib   "$root/lib"
      ln -sfn usr/lib64 "$root/lib64"

      test -e "$root/lib64/ld-linux-loongarch-lp64d.so.1"
      echo "QEMU_LD_PREFIX=$root" >> "$GITHUB_ENV"

  - name: Download Loongson .NET SDK (linux-loongarch64)
    shell: bash
    run: |
      set -euo pipefail
      curl -fL --retry 3 -o "$HOME/la64-sdk.tar.gz" \
        https://github.com/loongson/dotnet/releases/download/v10.0.113-loongarch64/dotnet-sdk-10.0.113-linux-loongarch64.tar.gz
      mkdir -p "$HOME/la64"
      tar -xzf "$HOME/la64-sdk.tar.gz" -C "$HOME/la64"
      echo "$HOME/la64" >> "$GITHUB_PATH"
      echo "DOTNET_ROOT=$HOME/la64" >> "$GITHUB_ENV"

  - name: Setup emulation environment
    shell: bash
    run: |
      {
        # 宿主没有 loong64 原生 ICU，测试与冒烟以 invariant 模式运行
        echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1"
        echo "DOTNET_CLI_TELEMETRY_OPTOUT=1"
        # xunit.runner.console 面向 net6.0，需要靠 10.0 运行时承载
        echo "DOTNET_ROLL_FORWARD=LatestMajor"
        # 关闭 .NET 代码页双映射（W^X）：QEMU 的 loongarch64 用户态在该映射序列上会内部崩溃
        echo "DOTNET_EnableWriteXorExecute=0"
      } >> "$GITHUB_ENV"

  # Ubuntu 自带的 qemu 8.2 在 loongarch64 用户态仿真上会偶发内存损坏：xunit 并行执行测试时，
  # 运行期 AssemblyLoadContext 解析程序集用的字典被并发写坏，表现为 FileLoadException: xunit.assert。
  # 这里换成 Debian sid 的 qemu-user-static（静态链接，解包即用）并替换 binfmt 解释器；
  # 升级后立刻用 LA64 dotnet 自检，自检不过就回滚发行版 QEMU，保证 LA64 至少能跑（只是偶发不稳）。
  - name: Upgrade QEMU (best effort, Debian sid)
    shell: bash
    run: |
      set -uo pipefail
      bf=/proc/sys/fs/binfmt_misc/qemu-loongarch64
      interp=$(awk '$1=="interpreter"{print $2}' "$bf" 2>/dev/null || true)
      if [ -z "$interp" ]; then echo "binfmt 未注册，跳过 QEMU 升级"; exit 0; fi
      echo "发行版 QEMU: $("$interp" --version 2>/dev/null | head -1)"

      base=https://deb.debian.org/debian
      idx=/tmp/sid-amd64-Packages.xz
      got=0
      for i in 1 2 3; do
        if curl -fsSL --retry 3 --max-time 300 -o "$idx" "$base/dists/sid/main/binary-amd64/Packages.xz"; then got=1; break; fi
        echo "索引重试 $i"; sleep 5
      done
      if [ "$got" != "1" ]; then echo "索引下载失败，沿用发行版 QEMU"; exit 0; fi
      fn=$(xzcat "$idx" | awk '$1=="Package:" && $2=="qemu-user-static"{f=1} f && $1=="Filename:"{print $2; exit}')
      if [ -z "$fn" ]; then echo "索引中未找到 qemu-user-static，沿用发行版 QEMU"; exit 0; fi
      if ! curl -fsSL --retry 3 --max-time 300 -o /tmp/qemu-sid.deb "$base/$fn"; then echo "包下载失败，沿用发行版 QEMU"; exit 0; fi
      rm -rf /tmp/qemu-sid && dpkg-deb -x /tmp/qemu-sid.deb /tmp/qemu-sid
      new=/tmp/qemu-sid/usr/bin/qemu-loongarch64-static
      if [ ! -x "$new" ]; then echo "静态 QEMU 缺失，沿用发行版 QEMU"; exit 0; fi
      echo "候选 QEMU: $("$new" --version | head -1)"

      sudo cp -a "$interp" "$interp.dist"
      sudo cp "$new" "$interp"
      sudo chmod 755 "$interp"

      # 自检：必须在新的解释器下真实跑起 LA64 运行时
      if DOTNET_ROOT="$HOME/la64" QEMU_LD_PREFIX="$HOME/la64root" \
         DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1 DOTNET_EnableWriteXorExecute=0 \
         timeout 300 "$HOME/la64/dotnet" --version >/tmp/qemu-selfcheck.txt 2>&1; then
        echo "QEMU 升级自检通过: $(cat /tmp/qemu-selfcheck.txt)"
      else
        echo "升级后自检失败，回滚发行版 QEMU"
        cat /tmp/qemu-selfcheck.txt || true
        sudo cp -a "$interp.dist" "$interp"
      fi

  - name: Verify LA64 runtime
    shell: bash
    run: |
      set -euo pipefail
      # 仿真下真实执行 LA64 版 dotnet；RID 必须为 linux-loongarch64，否则后续测试结果不可信
      dotnet --info | tee /tmp/la64-info.txt
      grep -q 'RID:[[:space:]]*linux-loongarch64' /tmp/la64-info.txt
      grep -q 'Architecture:[[:space:]]*loongarch64' /tmp/la64-info.txt
