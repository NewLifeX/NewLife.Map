# Français 词表（fr）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Coordinates are empty.": "Les coordonnées sont vides."
"Address is empty.": "L'adresse est vide."
"IP is empty.": "L'IP est vide."
"No available map service provider was found.": "Aucun fournisseur de services cartographiques disponible n'a été trouvé."

"Failed to initialize the offline IP database: {0}": "Échec de l'initialisation de la base de données IP hors ligne : {0}"
"Starting to initialize MapProvider data...": "Début de l'initialisation des données MapProvider..."
"Finished initializing MapProvider data!": "Initialisation des données MapProvider terminée !"
"No address was found. Please make sure the IP database is ready.": "Aucune adresse trouvée. Veuillez vérifier que la base de données IP est prête."
"The coordinate system is not supported.": "Le système de coordonnées n'est pas pris en charge."
"No geographic data was found.": "Aucune donnée géographique trouvée."
"No geocoding result was found.": "Aucun résultat de géocodage trouvé."
"No route was found.": "Aucun itinéraire trouvé."

# Métadonnées des paramètres de carte (source en anglais, clés identiques à [DisplayName]/[Description])
"Map settings": "Paramètres de la carte"
"Enable map. Defaults to true.": "Activer la carte. La valeur par défaut est true."
"Map provider. Defaults to NewLife.": "Fournisseur de cartes. La valeur par défaut est NewLife."
"Browser-side map key.": "Clé de carte côté navigateur."
"Web service map key.": "Clé de carte du service web."
"Map center city. Defaults to Xi'an.": "Ville centrale de la carte. La valeur par défaut est Xi'an."
"Zoom level. 6 shows the whole country, 17 is the closest.": "Niveau de zoom. 6 affiche tout le pays, 17 est le zoom maximal."
"Satellite imagery. Defaults to false.": "Imagerie satellite. La valeur par défaut est false."
"Cache days. Days to refresh database records, defaults to 30.": "Jours de cache. Nombre de jours avant actualisation des enregistrements de la base, la valeur par défaut est 30."