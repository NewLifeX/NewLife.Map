"No address was found. Please make sure the IP database is ready.": "住所が見つかりませんでした。IP データベースの準備を確認してください。"
"The coordinate system is not supported.": "この座標系はサポートされていません。"
"No geographic data was found.": "地理データが見つかりませんでした。"
"No geocoding result was found.": "ジオコーディング結果が見つかりませんでした。"
