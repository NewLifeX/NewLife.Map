# 日本語 词表（ja）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Coordinates are empty.": "座標が空です。"
"Address is empty.": "住所が空です。"
"IP is empty.": "IP が空です。"
"No available map service provider was found.": "利用可能な地図サービスプロバイダーが見つかりません。"

"Failed to initialize the offline IP database: {0}": "オフライン IP データベースの初期化に失敗しました: {0}"
"Starting to initialize MapProvider data...": "MapProvider データの初期化を開始します..."
"Finished initializing MapProvider data!": "MapProvider データの初期化が完了しました！"
"No address was found. Please make sure the IP database is ready.": "住所が見つかりませんでした。IP データベースの準備を確認してください。"
"The coordinate system is not supported.": "この座標系はサポートされていません。"
"No geographic data was found.": "地理データが見つかりませんでした。"
"No geocoding result was found.": "ジオコーディング結果が見つかりませんでした。"
"No route was found.": "ルートが見つかりませんでした。"

# 地図設定のメタデータ（原文は英語、キーは [DisplayName]/[Description] の英語文字列と完全一致）
"Map settings": "地図設定"
"Enable map. Defaults to true.": "地図を有効にする。既定値は true。"
"Map provider. Defaults to NewLife.": "地図プロバイダー。既定値は NewLife。"
"Browser-side map key.": "ブラウザー側の地図キー。"
"Web service map key.": "Web サービスの地図キー。"
"Map center city. Defaults to Xi'an.": "地図の中心都市。既定値は西安。"
"Zoom level. 6 shows the whole country, 17 is the closest.": "ズームレベル。6 で全国、17 が最小。"
"Satellite imagery. Defaults to false.": "衛星画像。既定値は false。"
"Cache days. Days to refresh database records, defaults to 30.": "キャッシュ日数。データベースレコードを更新する日数、既定値は 30。"