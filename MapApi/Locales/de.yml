# Deutsch 词表（de）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Coordinates are empty.": "Koordinaten sind leer."
"Address is empty.": "Adresse ist leer."
"IP is empty.": "IP ist leer."
"No available map service provider was found.": "Es wurde kein verfügbarer Kartendienstanbieter gefunden."

"Failed to initialize the offline IP database: {0}": "Die Offline-IP-Datenbank konnte nicht initialisiert werden: {0}"
"Starting to initialize MapProvider data...": "Initialisierung der MapProvider-Daten wird gestartet..."
"Finished initializing MapProvider data!": "Initialisierung der MapProvider-Daten abgeschlossen!"
"No address was found. Please make sure the IP database is ready.": "Es wurde keine Adresse gefunden. Bitte stellen Sie sicher, dass die IP-Datenbank bereit ist."
"The coordinate system is not supported.": "Das Koordinatensystem wird nicht unterstützt."
"No geographic data was found.": "Es wurden keine Geodaten gefunden."
"No geocoding result was found.": "Es wurde kein Geokodierungsergebnis gefunden."
"No route was found.": "Es wurde keine Route gefunden."

# Metadaten der Karteneinstellungen (Quelltext Englisch, Schlüssel identisch mit [DisplayName]/[Description])
"Map settings": "Karteneinstellungen"
"Enable map. Defaults to true.": "Karte aktivieren. Standardwert ist true."
"Map provider. Defaults to NewLife.": "Kartenanbieter. Standardwert ist NewLife."
"Browser-side map key.": "Kartenschlüssel für den Browser."
"Web service map key.": "Kartenschlüssel für den Webdienst."
"Map center city. Defaults to Xi'an.": "Zentrale Stadt der Karte. Standardwert ist Xi'an."
"Zoom level. 6 shows the whole country, 17 is the closest.": "Zoomstufe. 6 zeigt das ganze Land, 17 ist die nächste Stufe."
"Satellite imagery. Defaults to false.": "Satellitenbilder. Standardwert ist false."
"Cache days. Days to refresh database records, defaults to 30.": "Cache-Tage. Tage bis zur Aktualisierung der Datenbankeinträge, Standardwert ist 30."