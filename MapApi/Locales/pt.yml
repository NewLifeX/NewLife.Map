# Português 词表（pt）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Coordinates are empty.": "As coordenadas estão vazias."
"Address is empty.": "O endereço está vazio."
"IP is empty.": "O IP está vazio."
"No available map service provider was found.": "Nenhum provedor de serviços de mapa disponível foi encontrado."

"Failed to initialize the offline IP database: {0}": "Falha ao inicializar o banco de dados IP offline: {0}"
"Starting to initialize MapProvider data...": "Iniciando a inicialização dos dados do MapProvider..."
"Finished initializing MapProvider data!": "Inicialização dos dados do MapProvider concluída!"
"No address was found. Please make sure the IP database is ready.": "Nenhum endereço foi encontrado. Verifique se o banco de dados IP está pronto."
"The coordinate system is not supported.": "O sistema de coordenadas não é suportado."
"No geographic data was found.": "Nenhum dado geográfico foi encontrado."
"No geocoding result was found.": "Nenhum resultado de geocodificação foi encontrado."
"No route was found.": "Nenhuma rota foi encontrada."
