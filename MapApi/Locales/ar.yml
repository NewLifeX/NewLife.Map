# العربية 词表（ar）。键为英文源文，与源码字符串逐字一致；缺少的键运行时回退英文。
"Coordinates are empty.": "الإحداثيات فارغة."
"Address is empty.": "العنوان فارغ."
"IP is empty.": "عنوان IP فارغ."
"No available map service provider was found.": "لم يتم العثور على مزوّد خدمة خرائط متاح."

"Failed to initialize the offline IP database: {0}": "فشل تهيئة قاعدة بيانات IP دون اتصال: {0}"
"Starting to initialize MapProvider data...": "بدء تهيئة بيانات MapProvider..."
"Finished initializing MapProvider data!": "اكتملت تهيئة بيانات MapProvider!"
"No address was found. Please make sure the IP database is ready.": "لم يتم العثور على عنوان. يرجى التأكد من جاهزية قاعدة بيانات IP."
"The coordinate system is not supported.": "نظام الإحداثيات غير مدعوم."
"No geographic data was found.": "لم يتم العثور على بيانات جغرافية."
"No geocoding result was found.": "لم يتم العثور على نتيجة ترميز جغرافي."
"No route was found.": "لم يتم العثور على مسار."

# بيانات تعريف إعدادات الخريطة (المصدر بالإنجليزية، والمفاتيح مطابقة تمامًا لـ [DisplayName]/[Description])
"Map settings": "إعدادات الخريطة"
"Enable map. Defaults to true.": "تفعيل الخريطة. القيمة الافتراضية true."
"Map provider. Defaults to NewLife.": "مزوّد الخرائط. القيمة الافتراضية NewLife."
"Browser-side map key.": "مفتاح الخريطة في المتصفح."
"Web service map key.": "مفتاح الخريطة لخدمة الويب."
"Map center city. Defaults to Xi'an.": "المدينة المركزية للخريطة. القيمة الافتراضية شيان."
"Zoom level. 6 shows the whole country, 17 is the closest.": "مستوى التكبير. 6 يعرض البلد بأكمله، و17 هو أقصى تقريب."
"Satellite imagery. Defaults to false.": "صور الأقمار الصناعية. القيمة الافتراضية false."
"Cache days. Days to refresh database records, defaults to 30.": "أيام التخزين المؤقت. عدد الأيام قبل تحديث سجلات قاعدة البيانات، والقيمة الافتراضية 30."